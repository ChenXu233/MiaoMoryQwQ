[package]
name = "mm-pipeline"
description = "MiaoMory 摄取流水线：scan → hash → decode → thumb → persist"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
mm-core = { path = "../core" }
mm-store = { path = "../store" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libheif-rs = "3"
kamadak-exif = "0.6"
sha2 = "0.11"
hex = "0.4"
walkdir = "2"
rayon = "1"
tracing = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
