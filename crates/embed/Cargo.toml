[package]
name = "mm-embed"
description = "MiaoMory 推理层：ort 推理 + 模型下载（唯一允许碰 ONNX 的 crate，白皮书 §4.1）"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
mm-core = { path = "../core" }
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.11"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 模型本地导入的唯一临时目录（drop 自动清理；防并发导入互踩）
tempfile = "3"
# EP 实现库预检（spec 0008 §3.1：providers_cuda.dll 加载失败即降级，避免 ort 段错误）
libloading = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# load-dynamic（ADR-0014）：运行时按用户选择加载 onnxruntime.dll 变体；
# cuda/directml feature 在其下仅门控 ep::Cuda/ep::DirectML 类型，不再参与链接
ort = { version = "=2.0.0-rc.13", features = ["directml", "cuda", "load-dynamic"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }
