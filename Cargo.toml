[workspace]
resolver = "2"
members = ["crates/*", "apps/app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ChenXu233"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# specta 系列版本必须与 tauri-specta 内部依赖严格一致（上游示例约定 =2.0.0-rc.x）
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }

# 发布优化：减小体积（白皮书 §6.1 安装包目标）
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
