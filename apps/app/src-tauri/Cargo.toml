[package]
name = "miaomory-app"
description = "MiaoMory——个人媒体语义索引引擎（Tauri 壳，唯一可执行物）"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
# `_lib` 后缀避免与 bin 名冲突（Windows，见 rust-lang/cargo#8519）
name = "miaomory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
mm-core = { path = "../../../crates/core" }
mm-platform = { path = "../../../crates/platform" }
mm-store = { path = "../../../crates/store" }
mm-pipeline = { path = "../../../crates/pipeline" }
mm-embed = { path = "../../../crates/embed" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
