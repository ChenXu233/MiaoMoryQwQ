[package]
name = "miaomory-app"
description = "MiaoMory——个人媒体语义索引引擎（Tauri 壳，唯一可执行物）"
version.workspace = true
edition.workspace = true
authors.workspace = true
# src-tauri 里有两个 bin（miaomory-app 与契约生成器 export_contracts），
# `tauri dev` 走裸 `cargo run`，必须显式指定默认二进制
default-run = "miaomory-app"

[lib]
# `_lib` 后缀避免与 bin 名冲突（Windows，见 rust-lang/cargo#8519）
name = "miaomory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
# 文件夹 watcher 自动同步（规格 0001 §3.9，2026-09-09 所有者指示提入本期）：
# 服务"资料库永远自动最新"主线——导入后新增照片无需任何手动操作即可入库建索引
notify = "8"
mm-core = { path = "../../../crates/core" }
mm-platform = { path = "../../../crates/platform" }
mm-store = { path = "../../../crates/store" }
mm-pipeline = { path = "../../../crates/pipeline" }
mm-embed = { path = "../../../crates/embed" }

[dev-dependencies]
tracing-subscriber = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
