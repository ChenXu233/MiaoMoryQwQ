name: wix-probe

on:
  workflow_dispatch:

# 32-bit VBScript COM check: WiX light.exe is x86 and hosts the script engine in-proc
# for MSI ICE validation. cscript (64-bit) passing does not prove SysWOW64 works.
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: install VBSCRIPT
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online -Name 'VBSCRIPT*'
          if (($cap | Where-Object State -eq 'Installed').Count -eq 0) {
            DISM /Online /Add-Capability /CapabilityName:VBSCRIPT~~~~0.0.1.0 /norestart
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          }

      - name: 64-bit cscript smoke
        shell: cmd
        run: |
          echo WScript.Echo "vbs64-ok" > "%TEMP%\probe.vbs"
          cscript //nologo "%TEMP%\probe.vbs"

      - name: 32-bit cscript smoke (SysWOW64)
        shell: cmd
        run: |
          echo WScript.Echo "vbs32-ok" > "%TEMP%\probe.vbs"
          C:\Windows\SysWOW64\cscript.exe //nologo "%TEMP%\probe.vbs"

      - name: COM registration state of vbscript both bitness
        shell: powershell
        run: |
          foreach ($f in @('C:\Windows\System32\vbscript.dll', 'C:\Windows\SysWOW64\vbscript.dll')) {
            if (Test-Path $f) {
              Write-Host "$f exists, size=$((Get-Item $f).Length)"
            } else {
              Write-Host "$f MISSING"
            }
          }
          # VBScript.RegExp ProgId resolution per view
          foreach ($reg in @('HKLM:\SOFTWARE\Classes\VBScript.RegExp', 'HKLM:\SOFTWARE\WOW6432Node\Classes\VBScript.RegExp')) {
            Write-Host "$reg present: $(Test-Path $reg)"
          }
