name: vbscript-probe

on:
  workflow_dispatch:

# one-shot diagnostic: verify DISM VBSCRIPT capability install works on the runner
# (WiX light.exe MSI ICE validation depends on it; tauri#13752)
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: check VBSCRIPT state
        shell: powershell
        run: Get-WindowsCapability -Online -Name 'VBSCRIPT*' | Format-List Name, State

      - name: DISM install VBSCRIPT
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online -Name 'VBSCRIPT*'
          if (($cap | Where-Object State -eq 'Installed').Count -eq 0) {
            DISM /Online /Add-Capability /CapabilityName:VBSCRIPT~~~~0.0.1.0 /norestart
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          } else { Write-Host "VBSCRIPT already installed, skip" }

      - name: VBSCRIPT smoke test (cscript)
        shell: cmd
        run: |
          echo WScript.Echo "vbscript-ok" > "%TEMP%\probe.vbs"
          cscript //nologo "%TEMP%\probe.vbs"
