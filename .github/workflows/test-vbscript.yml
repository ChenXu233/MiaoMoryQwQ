name: wix-probe

on:
  workflow_dispatch:

# v4: byte-for-byte replica of release.yml windows leg + -vv so light's stderr is visible
jobs:
  probe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 格式并提取版本号（注入 0.1.1，模拟 tag 版本）
        shell: bash
        run: echo "APP_VERSION=0.1.1" >> "$GITHUB_ENV"

      - name: Enable VBSCRIPT
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online -Name 'VBSCRIPT*'
          if (($cap | Where-Object State -eq 'Installed').Count -eq 0) {
            DISM /Online /Add-Capability /CapabilityName:VBSCRIPT~~~~0.0.1.0 /norestart
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 libheif（Windows，vcpkg + 二进制缓存）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\vcpkg-binary-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=C:\vcpkg-binary-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif:x64-windows"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 缓存 vcpkg 产物
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-libheif-x64-windows-1.23

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: release-probe

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 注入版本号（仅本次构建工作区）
        run: node scripts/set-version.mjs "${{ env.APP_VERSION }}"

      - name: 安装 git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: 生成发布说明
        shell: bash
        run: |
          {
            echo "RELEASE_NOTES<<GITCLIFF_EOF"
            git-cliff --config scripts/cliff.toml --latest --strip header
            echo "GITCLIFF_EOF"
          } >> "$GITHUB_ENV"

      - name: 准备打包运行时（runtime/dml）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-bundle-runtime.ps1

      # 与 release.yml 唯一差异：args 里的 -vv（让 light 的 stderr 可见）
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tagName: v0.1.1-alpha.1
          releaseName: "MiaoMory v0.1.1-alpha.1"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: true
          args: -vv
          uploadUpdaterJson: false
