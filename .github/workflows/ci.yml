name: CI

on:
  push:
    branches: [main]
  pull_request:

# 常驻内容（ADR-0010）：格式 / lint / clippy / tsc / 单元测试 / 契约一致性 / 三平台构建矩阵
# 不含 e2e 与任何性能 bench（ADR-0004/0010）

jobs:
  quality:
    name: 质量门（fmt/clippy/test/tsc/契约一致）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装 Linux 系统依赖（tauri + libde265）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libde265-dev

      - name: 源码构建 libheif 1.23（apt 版本过旧，libheif-sys 要求 >=1.23）
        run: |
          git clone --depth 1 --branch v1.23.2 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/libheif/build -j
          sudo cmake --install /tmp/libheif/build
          sudo ldconfig

      - uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查（vue-tsc）
        run: pnpm --filter miaomory-app typecheck

      # generate_context! 编译期要求 frontendDist 存在
      - name: 前端构建（vite build）
        run: pnpm --filter miaomory-app exec vite build

      - name: Rust 格式检查
        run: cargo fmt --all --check

      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --workspace

      - name: 契约生成一致性（铁律 6）
        run: |
          cargo run -p miaomory-app --bin export_contracts
          git diff --exit-code -- packages/contracts

  build:
    name: 三平台构建（${{ matrix.os }}，不签名）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # WiX light.exe 的 MSI ICE 校验依赖 VBSCRIPT；runner 镜像 2026-09 起默认移除（tauri#13752）
      - name: Enable VBSCRIPT for WiX (windows leg)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online -Name 'VBSCRIPT*'
          if (($cap | Where-Object State -eq 'Installed').Count -eq 0) {
            DISM /Online /Add-Capability /CapabilityName:VBSCRIPT~~~~0.0.1.0 /norestart
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          } else { Write-Host "VBSCRIPT already installed, skip" }

      - name: 安装 Linux 系统依赖（tauri + libde265）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libde265-dev

      - name: 安装 macOS 依赖（libde265 + cmake）
        if: runner.os == 'macOS'
        run: brew install libde265 cmake

      - name: 源码构建 libheif 1.23（apt/brew 版本过旧，libheif-sys 要求 >=1.23）
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 --branch v1.23.2 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/libheif/build -j
          sudo cmake --install /tmp/libheif/build
          if [ "$RUNNER_OS" = "Linux" ]; then sudo ldconfig; fi

      - name: 安装 libheif（Windows，vcpkg + 二进制缓存）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\vcpkg-binary-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=C:\vcpkg-binary-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif:x64-windows"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 缓存 vcpkg 产物
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-libheif-x64-windows-1.23

      - uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建应用
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter miaomory-app tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: miaomory-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*
            target/release/bundle/msi/*
            target/release/bundle/dmg/*
            target/release/bundle/macos/*
            target/release/bundle/deb/*
            target/release/bundle/rpm/*
            target/release/bundle/appimage/*
